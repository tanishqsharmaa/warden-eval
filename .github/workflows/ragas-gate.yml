name: RAGAS Quality Gate CI

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  ragas-eval:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv pip install -e ".[dev]"

    - name: Start Docker Compose Testbed
      run: |
        docker compose -f docker-compose.testbed.yml up -d
        sleep 30

    - name: Execute Golden 50 RAGAS Quality Gate
      env:
        AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
        AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
        WARDEN_API_BASE_URL: "http://localhost:8080"
        ENFORCE_QUALITY_GATES: "true"
      run: |
        python -m warden_eval.runner --dataset eval/datasets/eval_golden_50.json --enforce-gates

    - name: Upload Evaluation Scorecards
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ragas-scorecards
        path: eval/reports/
